---
name: "Setup mise"
description: "Installs mise with a pinned version and retry logic"
inputs:
  version:
    description: "mise version to install"
    required: false
    default: "2026.3.10"
  install_args:
    description: "Arguments to pass to `mise install`"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      id: mise-1
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
        install_args: ${{ inputs.install_args }}

    - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      if: ${{ steps.mise-1.outcome == 'failure' }}
      id: mise-2
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
        install_args: ${{ inputs.install_args }}

    - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      if: ${{ steps.mise-2.outcome == 'failure' }}
      with:
        version: ${{ inputs.version }}
        install_args: ${{ inputs.install_args }}

    - name: Scan mise installs with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ env.HOME }}/.local/share/mise/installs
        scanners: vuln # secrets/misconfig produce noise on bundled stdlib trees
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: sarif
        output: trivy-mise.sarif

    - name: Upload results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
      with:
        sarif_file: trivy-mise.sarif
        category: trivy-mise
